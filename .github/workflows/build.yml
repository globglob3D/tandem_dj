# Tests and builds Tandem DJ on Windows and macOS.
#
# Every run uploads the setup program and the disk images as artifacts, downloadable from the page of the run.
# Pushing a tag such as v0.2.0 also publishes them as a GitHub release.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            artifact: windows
            files: dist/Tandem DJ Setup *.exe
          - name: macOS (Apple Silicon)
            runner: macos-latest
            artifact: macos-arm64
            files: dist/*.dmg
          - name: macOS (Intel)
            runner: macos-15-intel
            artifact: macos-x64
            files: dist/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the environment
        run: uv sync

      - name: Download sockseek
        run: uv run python scripts/build.py --only-sockseek

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run the tests
        run: uv run pytest

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      - name: Build the application
        run: uv run python scripts/build.py

      - name: Start the built application
        run: uv run python scripts/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: tandem-dj-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
