[project]
name = "tandem-dj"
version = "0.2.0"
description = "A window for managing DJ music: read playlists and batch-download their tracks from Soulseek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6",
    "yt-dlp>=2025.1.1",
]

[project.gui-scripts]
tandem = "tandem_dj.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem_dj"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
indent-width = 4
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tandem_dj"]
